# 식단 자동 갱신 + 웹페이지(GitHub Pages) 배포
# - 매일 아침(한국 시간 06:17)과 오전(10:47)에 실행
# - inbox 폴더에 식단표 사진을 올리거나, docs·scripts를 고치면 바로 실행
# - Actions 탭 → "식단 갱신" → "Run workflow" 버튼으로 직접 실행 가능
name: 식단 갱신

on:
  schedule:
    - cron: "17 21 * * *"   # UTC 21:17 = 한국 06:17
    - cron: "47 1 * * *"    # UTC 01:47 = 한국 10:47 (늦게 올라온 식단 확인)
  push:
    branches: [main]
    paths:
      - "inbox/**"
      - "docs/**"
      - "scripts/**"
      - "requirements*.txt"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-menus
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 필요한 도구 설치
        run: pip install -r requirements.txt

      - name: 식단 수집·판독
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OCR_PROVIDER: ${{ vars.OCR_PROVIDER }}
          OCR_MODEL: ${{ vars.OCR_MODEL }}
        run: |
          if [ -z "$OCR_MODEL" ]; then unset OCR_MODEL; fi
          if [ -z "$OCR_PROVIDER" ]; then unset OCR_PROVIDER; fi
          python scripts/update.py

      - name: 바뀐 내용 저장(커밋)
        run: |
          git config user.name "menu-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs state
          if git diff --cached --quiet; then
            echo "바뀐 식단 없음"
          else
            git commit -m "식단 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            git pull --rebase
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
